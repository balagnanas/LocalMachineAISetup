# Merge these portable settings into ~/.codex/config.toml.
# Keep credentials, local paths, MCP environment values, and machine-specific
# application settings only in your untracked local configuration.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_concurrent_threads_per_session = 2
